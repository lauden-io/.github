name: Update the public repositories list

on:
  schedule:
    - cron: "23 4 * * *"  # every day
  workflow_dispatch:

permissions:
  contents: write  # to commit the refreshed list; nothing else

concurrency:
  group: update-repos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Rebuild the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_repos.py
      - name: Commit if it changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the public repositories list"
          git push
